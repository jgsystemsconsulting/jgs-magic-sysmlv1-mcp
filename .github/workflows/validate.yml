# Release gate for the jgs-magic-sysmlv1-mcp distribution (RR-B-15). The gate
# script is stdlib-only and reads the tree; the workflow carries read-only
# permissions and no secrets.
name: validate
on:
  push:
  pull_request:
permissions: read-all
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release gate (required files, forbidden paths/content, headers, versions)
        run: python3 scripts/check_release.py
