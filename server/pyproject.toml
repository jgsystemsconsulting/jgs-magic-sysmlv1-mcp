[project]
name = "jgsc-sysmlv1-mcp"
version = "0.1.1"
description = "MCP server bridging AI agents to SysML v1 models in CATIA Magic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "JG Systems Consulting Ltd." }]
dependencies = [
    "mcp >= 1.0",
    "httpx >= 0.27",
    "pydantic >= 2.6",
    "pyyaml >= 6.0",
    "pillow >= 10.0",
]


[project.scripts]
jgsc-sysmlv1-mcp = "jgsc_sysmlv1_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/jgsystemsconsulting/jgs-magic-sysmlv1-mcp"
Repository = "https://github.com/jgsystemsconsulting/jgs-magic-sysmlv1-mcp"
Documentation = "https://github.com/jgsystemsconsulting/jgs-magic-sysmlv1-mcp/blob/main/docs/install.md"
Issues = "https://github.com/jgsystemsconsulting/jgs-magic-sysmlv1-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jgsc_sysmlv1_mcp", "src/magic_mcp_core"]

